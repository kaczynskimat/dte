services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: dte-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  redis-cache:
    image: redis:7-alpine
    container_name: dte-redis
    ports:
      - "6379:6379"

  state-bridge:
    profiles: ["demo", "dashboard"]
    # Python runs as PID 1 without a SIGTERM handler; init makes `docker compose stop` immediate.
    init: true
    build:
      context: .
      dockerfile: src/state_bridge/Dockerfile
    environment:
      MQTT_HOST: mqtt-broker
      REDIS_HOST: redis-cache
    depends_on:
      - mqtt-broker
      - redis-cache
    restart: unless-stopped

  prediction-worker:
    profiles: ["demo", "dashboard"]
    init: true
    build:
      context: .
      dockerfile: src/ml/Dockerfile
    command:
      - python
      - -m
      - src.ml.predictor
      - --redis-host
      - redis-cache
      - --bus-id
      - B208
      # A tick arrives every 100 ms at 10x and a forecast takes up to ~65 ms; a 50 ms poll could
      # miss a tick, which resets the 60 s history.
      - --poll-interval
      - "0.01"
    depends_on:
      - redis-cache
      - state-bridge
    restart: unless-stopped

  replay-producer:
    profiles: ["demo"]
    init: true
    build:
      context: .
      dockerfile: src/replay/Dockerfile
    command:
      - python
      - -m
      - src.replay.producer
      - --file
      - /app/data/test_mission_2021-10-05.csv
      - --broker-host
      - mqtt-broker
      - --bus-id
      - B208
      - --expected-route
      - "83"
      - --speed
      - "${REPLAY_SPEED:-1}"
      - --start-time
      - "${REPLAY_START:-}"
      - --end-time
      - "${REPLAY_END:-}"
    depends_on:
      - mqtt-broker
      - state-bridge

  # The web dashboard (Fleet + Replay pages). Start it with `docker compose --profile dashboard up`;
  # its Replay page runs the producer itself, so the `demo` replay-producer is not needed alongside.
  dashboard:
    profiles: ["dashboard"]
    init: true
    build:
      context: .
      dockerfile: src/dashboard/Dockerfile
    environment:
      REPLAY_MQTT_HOST: mqtt-broker
      REPLAY_REDIS_HOST: redis-cache
      REPLAY_START: ${REPLAY_START-2021-10-05 07:00:00}
      REPLAY_END: ${REPLAY_END-2021-10-05 09:00:00}
    volumes:
      - ./data:/app/data:ro  # every prepared dataset, for the Replay page's table
    ports:
      - "8501:8501"  # dashboard
      - "8503:8503"  # live twin feed polled by the Fleet page
    depends_on:
      - mqtt-broker
      - redis-cache
      - state-bridge
      - prediction-worker
    restart: unless-stopped
